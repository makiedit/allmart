<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Allmart Supermarket - ማልማርት ሱፐርማርኬት</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ሄደር እና የናቪጌሽን ምድቦች -->
    <header>
        <h1>🛒 Allmart Supermarket</h1>
        <nav>
            <button onclick="filterCategory('all')">ሁሉም እቃዎች</button>
            <button onclick="filterCategory('electronics')">ኤሌክትሮኒክስ</button>
            <button onclick="filterCategory('clothing')">አልባሳት</button>
            <button onclick="filterCategory('furniture')">የቤት እቃዎች</button>
        </nav>
    </header>

    <main class="main-container">
        <!-- የምርት ማሳያ ክፍል -->
        <section class="products-section">
            <h2>የምርቶች ዝርዝር</h2>
            <div id="product-list" class="product-grid">
                <!-- ጃቫስክሪፕቱ ምርቶቹን እዚህ ውስጥ በአውቶማቲክ ይጭናል -->
            </div>
        </section>

        <!-- የጎንዮሽ ማስተካከያ (ካርት እና ማወዳደሪያ) -->
        <aside class="sidebar-section">
            <!-- 1. የእቃ ማወዳደሪያ ክፍል -->
            <div class="compare-box">
                <h3>📊 እቃዎችን ማወዳደሪያ</h3>
                <div class="compare-selectors">
                    <select id="compare-1" onchange="updateComparison()">
                        <option value="">እቃ 1 ይምረጡ</option>
                    </select>
                    <select id="compare-2" onchange="updateComparison()">
                        <option value="">እቃ 2 ይምረጡ</option>
                    </select>
                </div>
                <div id="compare-result-box" class="compare-result-box">
                    <p style="color: #777; text-align:center;">እባክዎ ለማወዳደር ሁለቱንም እቃዎች ይምረጡ።</p>
                </div>
            </div>

            <!-- 2. የግዢ ከረጢት (Cart) ክፍል -->
            <div class="cart-box">
                <h3>🛍️ የግዢ ከረጢት (Cart)</h3>
                <div id="cart-items">
                    <p>ከረጢቱ ባዶ ነው።</p>
                </div>

                <!-- የኩፖን ክፍል -->
                <div class="promo-box">
                    <input type="text" id="promo-input" placeholder="የኩፖን ኮድ (ለምሳሌ: MAKI2026)">
                    <button onclick="applyPromoCode()">አረጋግጥ</button>
                    <p id="promo-message" style="font-size: 12px; margin-top: 5px;"></p>
                </div>

                <!-- የማስረከቢያ ቦታ መረጣ -->
                <div class="delivery-box">
                    <label>አካባቢ ይምረጡ:</label>
                    <select id="customer-location" onchange="updateDeliveryFee()">
                        <option value="" data-fee="0">አካባቢ ይምረጡ</option>
                        <option value="አዲስ አበባ" data-fee="150">አዲስ አበባ (150 ብር)</option>
                        <option value="ጎንደር" data-fee="250">ጎንደር (250 ብር)</option>
                        <option value="ባህር ዳር" data-fee="200">ባህር ዳር (200 ብር)</option>
                    </select>
                </div>

                <div id="cart-total" class="cart-total">
                    <b>ዕቃዎች ድምር:</b> 0 ብር
                </div>

                <!-- 3. የትዕዛዝ ማስተላለፊያ ፎርም -->
                <form id="checkout-form" onsubmit="checkout(event)">
                    <input type="text" id="customer-name" placeholder="ሙሉ ስምዎ" required>
                    <input type="text" id="customer-phone" placeholder="ስልክ ቁጥርዎ" required>
                    
                    <select id="payment-method" required>
                        <option value="ቀጥታ የባንክ ማስተላለፍ (Bank Transfer)">ቴሌብር / ባንክ ማስተላለፍ</option>
                    </select>

                    <input type="text" id="transaction-id" placeholder="የክፍያ ማረጋገጫ (Transaction ID) - ግዴታ" required>
                    
                    <button type="submit" class="checkout-btn">ትዕዛዝ አስተላልፍ 🚀</button>
                </form>
            </div>
        </aside>
    </main>

    <!-- 4. የአስተዳዳሪ ማዕከል ክፍል (Admin Dashboard) -->
    <div id="admin-modal" class="modal" style="display: none;">
        <div class="modal-content admin-content">
            <h2>🛠️ የአስተዳዳሪ ፓነል (Admin Dashboard)</h2>
            <p>እቃዎችን ለመጨመር፣ ለማስተካከል እና ለመሰረዝ መቆጣጠሪያ።</p>
            
            <div class="add-product-form">
                <h3>አዲስ እቃ ለመጨመር</h3>
                <input type="text" id="admin-product-name" placeholder="የእቃው ስም">
                <input type="number" id="admin-product-price" placeholder="ዋጋ (ብር)">
                <select id="admin-product-category">
                    <option value="electronics">ኤሌክትሮኒክስ</option>
                    <option value="clothing">አልባሳት</option>
                    <option value="furniture">የቤት እቃዎች</option>
                </select>
                <input type="text" id="admin-product-image" placeholder="የምስል ሊንክ (URL)">
                <button onclick="adminAddProduct()">እቃ ጨምር</button>
            </div>

            <hr style="margin: 20px 0;">
            <h3>የነባር እቃዎች ዝርዝር</h3>
            <div id="admin-product-management-list" style="max-height: 250px; overflow-y: auto;"></div>
            
            <button onclick="window.location.href = window.location.pathname" style="margin-top: 15px; background: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer;">አስተዳዳሪ ውጣ (Close)</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
