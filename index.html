<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ማክቤል ማርት (Allmart Supermarket)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- የላይኛው ማሰሻ (Header) -->
    <header>
        <div class="logo">🛒 ማክቤል ማርት</div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="ምርቶችን ይፈልጉ..." onkeyup="searchProducts()">
        </div>
    </header>

    <!-- የከረጢት እና የደንበኛ መረጃ ማካተቻ ክፍል (ከላይ) -->
    <section class="checkout-section">
        <h2>🛍️ የከረጢትዎ ይዘት እና የትዕዛዝ ማጠናቀቂያ</h2>
        
        <div id="cart-items">ካርቱ ባዶ ነው።</div>
        <p id="total-price">ጠቅላላ ዋጋ: 0 ብር</p>

        <!-- የደንበኛ መረጃዎች ማስገቢያ ፎርም -->
        <div class="customer-form">
            <h3>የመላኪያ መረጃዎ</h3>
            <input type="text" id="customer-name" placeholder="ሙሉ ስምዎ (ለምሳሌ፦ ማክቤል ካሰዬ)" required>
            <input type="text" id="customer-phone" placeholder="ስልክ ቁጥር (ለምሳሌ፦ 0911223344)" required>
            <input type="text" id="customer-location" placeholder="የሚገኙበት ቦታ/አድራሻ (ለምሳሌ፦ አዲስ አበባ፣ ቦሌ)" required>
            
            <label for="payment-method">የክፍያ አማራጭ ይምረጡ፡</label>
            <select id="payment-method">
                <option value="ቴሌብር (Telebirr)">ቴሌብር (Telebirr)</option>
                <option value="የኢትዮጵያ ንግድ ባንክ (CBE)">የኢትዮጵያ ንግድ ባንክ (CBE)</option>
                <option value="እቃው ሲደርስ በጥሬ ገንዘብ (Cash on Delivery)">እቃው ሲደርስ በጥሬ ገንዘብ (Cash)</option>
            </select>
        </div>

        <button onclick="checkout(event)" class="checkout-btn">ትዕዛዝ ወደ ቴሌግራም ላክ</button>
    </section>

    <!-- የምርት ምድቦች (Categories) -->
    <div class="categories">
        <button onclick="filterProducts('all')">ሁሉም</button>
        <button onclick="filterProducts('electronics')">ኤሌክትሮኒክስ</button>
        <button onclick="filterProducts('clothes')">ልብስ</button>
        <button onclick="filterProducts('appliances')">የቤት እቃዎች</button>
    </div>

    <!-- ዋናው የምርት ማሳያ ክፍል -->
    <main>
        <div id="product-list" class="product-grid">
            <!-- ምርቶች በ JavaScript አማካኝነት እዚህ ይገባሉ -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
